<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="760" height="330" fill="#ffffff"/>
  <!-- ESP32 -->
  <rect x="470" y="40" width="250" height="215" rx="12" fill="#e8eefc" stroke="#3b5bdb" stroke-width="2"/>
  <text x="595" y="68" text-anchor="middle" font-weight="bold" fill="#1e3a8a">ESP32-S3</text>
  <circle cx="470" cy="120" r="5" fill="#3b5bdb"/><text x="485" y="125" fill="#1e3a8a">3V3</text>
  <circle cx="470" cy="170" r="5" fill="#3b5bdb"/><text x="485" y="175" fill="#1e3a8a">GND</text>
  <circle cx="470" cy="220" r="5" fill="#3b5bdb"/><text x="485" y="225" fill="#1e3a8a">GPIO 4</text>
  <!-- Sensor -->
  <rect x="40" y="70" width="230" height="190" rx="12" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
  <text x="155" y="98" text-anchor="middle" font-weight="bold" fill="#9c360b">TCRT5000 module</text>
  <circle cx="270" cy="120" r="5" fill="#d9480f"/><text x="250" y="125" text-anchor="end" fill="#9c360b">VCC</text>
  <circle cx="270" cy="170" r="5" fill="#d9480f"/><text x="250" y="175" text-anchor="end" fill="#9c360b">GND</text>
  <circle cx="270" cy="220" r="5" fill="#d9480f"/><text x="250" y="225" text-anchor="end" fill="#9c360b">D0</text>
  <text x="60" y="250" fill="#9c360b" font-size="12">(A0 not used)</text>
  <!-- wires -->
  <path d="M270 120 H470" stroke="#e03131" stroke-width="3" fill="none"/>
  <path d="M270 170 H470" stroke="#212529" stroke-width="3" fill="none"/>
  <path d="M270 220 H470" stroke="#2f9e44" stroke-width="3" fill="none"/>
  <text x="370" y="112" text-anchor="middle" fill="#e03131">3.3 V</text>
  <text x="370" y="162" text-anchor="middle" fill="#212529">GND</text>
  <text x="370" y="212" text-anchor="middle" fill="#2f9e44">signal</text>
  <!-- fan note -->
  <rect x="40" y="280" width="680" height="36" rx="8" fill="#fff5f5" stroke="#e03131"/>
  <text x="380" y="303" text-anchor="middle" fill="#c92a2a">Power the fan from its OWN supply. Only share GND with the ESP32.</text>
</svg>
